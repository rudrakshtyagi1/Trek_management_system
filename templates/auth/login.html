{% extends "shared/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-panel">
    <h3 class="brand-font mb-4 text-center">Log in</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">I am a</label>
            <select name="role" class="form-select" required>
                <option value="user">User (Trekker)</option>
                <option value="staff">Trek Staff</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Email / Username</label>
            <input type="text" name="identifier" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-forest w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </p>
</div>
{% endblock %}
